<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Fast & secure game top-ups in Cambodia. KHQR Payment — Instant Delivery." />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GameTopUp" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="GameTopUp" />
    <meta name="msapplication-TileColor" content="#0f172a" />

    <!-- Creative fonts: Space Grotesk (headings) + Inter (body) + JetBrains Mono (code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- ═══ Tailwind CSS via CDN (build-time PostCSS pipeline incompatible with this Node.js setup) ═══ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#f0f5ff', 100: '#e0ebff', 200: '#b8d4ff', 300: '#85b8ff',
                400: '#4d96ff', 500: '#2563eb', 600: '#1d4ed8', 700: '#1e40af',
                800: '#1e3a8a', 900: '#1e3a5f',
              },
              surface: {
                50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1',
                400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155',
                800: '#1e293b', 900: '#0f172a', 950: '#020617',
              },
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
              heading: ['Space Grotesk', 'Inter', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'fade-in-up': 'fadeInUp 0.5s ease-out',
              'slide-up': 'slideUp 0.3s ease-out',
              'slide-down': 'slideDown 0.3s ease-out',
              'float': 'float 3s ease-in-out infinite',
              'glow': 'glow 2s ease-in-out infinite alternate',
              'glow-pulse': 'glowPulse 1.5s ease-in-out infinite',
              'shimmer': 'shimmer 2s linear infinite',
              'spin-slow': 'spin 3s linear infinite',
              'scale-in': 'scaleIn 0.3s ease-out',
              'bounce-gentle': 'bounceGentle 2s ease-in-out infinite',
              'drift': 'drift 6s ease-in-out infinite',
              'depth-pulse': 'depthPulse 4s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              fadeInUp: { '0%': { opacity: '0', transform: 'translateY(16px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
              slideUp: { '0%': { transform: 'translateY(10px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
              slideDown: { '0%': { transform: 'translateY(-10px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
              float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-12px)' } },
              glow: { '0%': { boxShadow: '0 0 20px rgba(37, 99, 235, 0.1)' }, '100%': { boxShadow: '0 0 40px rgba(37, 99, 235, 0.3)' } },
              glowPulse: { '0%, 100%': { opacity: '0.4' }, '50%': { opacity: '0.8' } },
              shimmer: { '0%': { transform: 'translateX(-100%)' }, '100%': { transform: 'translateX(100%)' } },
              scaleIn: { '0%': { transform: 'scale(0.95)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
              bounceGentle: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-4px)' } },
              drift: { '0%, 100%': { transform: 'translate(0, 0) rotate(0deg)' }, '25%': { transform: 'translate(8px, -8px) rotate(1deg)' }, '50%': { transform: 'translate(-4px, -14px) rotate(-0.5deg)' }, '75%': { transform: 'translate(6px, -6px) rotate(0.5deg)' } },
              depthPulse: { '0%, 100%': { opacity: '0.15', transform: 'scale(1)' }, '50%': { opacity: '0.25', transform: 'scale(1.05)' } },
            },
          },
        },
      }
    </script>

    <title>GameTopUp - Game Top-Up Cambodia</title>

    <!-- ═══ App Splash Screen ═══ -->
    <style>
      /* ─── Splash: shown before Vue mounts, hidden via JS ─── */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      @media (prefers-color-scheme: dark) {
        #app-splash { background: #020617; }
      }
      #app-splash.splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* ─── Logo container ─── */
      .splash-logo {
        width: 88px;
        height: 88px;
        border-radius: 20px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(37, 99, 235, 0.15);
      }
      .splash-logo-inner {
        position: absolute;
        inset: 3px;
        border-radius: 17px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      @media (prefers-color-scheme: dark) {
        .splash-logo-inner { background: #0f172a; }
      }
      .splash-logo-inner img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      /* ─── Animated gradient ring ─── */
      .splash-ring {
        position: absolute;
        inset: 0;
        border-radius: inherit;
      }
      .splash-ring::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: conic-gradient(from 0deg, #4d96ff, #2563eb, #8b5cf6, #c084fc, #2563eb, #4d96ff);
        animation: splash-spin 3s linear infinite;
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }

      /* ─── Brand text ─── */
      .splash-brand {
        margin-top: 24px;
        font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
        font-size: 22px;
        font-weight: 700;
        background: linear-gradient(135deg, #1e293b, #475569);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      @media (prefers-color-scheme: dark) {
        .splash-brand {
          background: linear-gradient(135deg, #f1f5f9, #94a3b8);
          -webkit-background-clip: text;
          background-clip: text;
        }
      }

      /* ─── Dot loader ─── */
      .splash-loader {
        margin-top: 20px;
        display: flex;
        gap: 6px;
      }
      .splash-loader span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #2563eb;
        animation: splash-dot 1.4s ease-in-out infinite both;
      }
      @media (prefers-color-scheme: dark) {
        .splash-loader span { background: #4d96ff; }
      }
      .splash-loader span:nth-child(1) { animation-delay: 0s; }
      .splash-loader span:nth-child(2) { animation-delay: 0.16s; }
      .splash-loader span:nth-child(3) { animation-delay: 0.32s; }
      @keyframes splash-dot {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
      }

      /* ─── Entrance animation ─── */
      .splash-entrance {
        opacity: 0;
        transform: translateY(20px) scale(0.92);
        animation: splash-fade-in 0.6s cubic-bezier(0.33, 1, 0.68, 1) 0.1s forwards;
      }
      @keyframes splash-fade-in {
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
    </style>
  </head>
  <body class="bg-surface-50 dark:bg-surface-950 text-surface-900 dark:text-surface-100 antialiased">
    <!-- Splash Screen -->
    <div id="app-splash">
      <div class="splash-entrance" style="display:flex;flex-direction:column;align-items:center;">
        <div class="splash-logo">
          <div class="splash-ring"></div>
          <div class="splash-logo-inner">
            <img src="/logo.png" alt="GameTopUp" />
          </div>
        </div>
        <div class="splash-brand">GameTopUp</div>
        <div class="splash-loader">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
