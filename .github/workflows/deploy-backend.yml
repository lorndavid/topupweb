name: 🚀 Deploy Backend & Health Check

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.backend.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-production
  cancel-in-progress: true

jobs:
  verify:
    name: 🛡️ Verify Production Health & Auto-Rollback
    runs-on: ubuntu-latest

    steps:
      - name: ⏳ Wait for Debian VPS to Auto-Deploy & Sync
        run: |
          echo "Waiting 30s for Debian auto-deploy daemon to pull and rebuild..."
          sleep 30

      - name: 🩺 Check Production API Health
        run: |
          echo "Verifying live endpoint: https://api.vidtopup.store/api/health"
          HEALTHY=false
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.vidtopup.store/api/health || true)
            if [ "$STATUS" = "200" ]; then
              HEALTHY=true
              echo "✅ Health check passed with HTTP 200! (attempt $i/12)"
              break
            fi
            echo "Waiting for live API... HTTP status: $STATUS ($i/12)"
            sleep 5
          done

          if [ "$HEALTHY" = false ]; then
            echo "❌ Production API health check failed!"
            exit 1
          fi

      - name: 🎉 Deployment Verified
        run: |
          echo "✅ Backend production API is healthy and operational!"
