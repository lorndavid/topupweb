        align-items: center;
        justify-content: center;
        background: #f8fafc;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      @media (prefers-color-scheme: dark) {
        #app-splash { background: #020617; }
      }
      #app-splash.splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* ─── Logo container ─── */
      .splash-logo {
        width: 88px;
        height: 88px;
        border-radius: 20px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(37, 99, 235, 0.15);
      }
      .splash-logo-inner {
        position: absolute;
        inset: 3px;
        border-radius: 17px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      @media (prefers-color-scheme: dark) {
        .splash-logo-inner { background: #0f172a; }
      }
      .splash-logo-inner img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      /* ─── Animated gradient ring ─── */
      .splash-ring {
        position: absolute;
        inset: 0;
        border-radius: inherit;
      }
      .splash-ring::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: conic-gradient(from 0deg, #4d96ff, #2563eb, #8b5cf6, #c084fc, #2563eb, #4d96ff);
        animation: splash-spin 3s linear infinite;
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }

      /* ─── Brand text ─── */
      .splash-brand {
        margin-top: 24px;
        font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
        font-size: 22px;
        font-weight: 700;
        background: linear-gradient(135deg, #1e293b, #475569);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      @media (prefers-color-scheme: dark) {
        .splash-brand {
          background: linear-gradient(135deg, #f1f5f9, #94a3b8);
          -webkit-background-clip: text;
          background-clip: text;
        }
      }

      /* ─── Dot loader ─── */
      .splash-loader {
        margin-top: 20px;
        display: flex;
        gap: 6px;
      }
      .splash-loader span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #2563eb;
        animation: splash-dot 1.4s ease-in-out infinite both;
      }
      @media (prefers-color-scheme: dark) {
        .splash-loader span { background: #4d96ff; }
      }
      .splash-loader span:nth-child(1) { animation-delay: 0s; }
      .splash-loader span:nth-child(2) { animation-delay: 0.16s; }
      .splash-loader span:nth-child(3) { animation-delay: 0.32s; }
      @keyframes splash-dot {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
      }

      /* ─── Floating particles behind logo ─── */
      .splash-particles {
        position: absolute;
        inset: -60px;
        pointer-events: none;
        overflow: visible;
      }
      .splash-particle {
        position: absolute;
        border-radius: 50%;
        opacity: 0;
        animation: particle-float var(--p-dur, 6s) ease-in-out infinite;
        animation-delay: var(--p-delay, 0s);
      }
      .splash-particle:nth-child(1) {
        width: 10px; height: 10px;
        background: linear-gradient(135deg, #4d96ff, #2563eb);
        top: 10%; left: 5%;
        --p-dur: 7s; --p-delay: 0s;
        --p-x: 30px; --p-y: -20px;
      }
      .splash-particle:nth-child(2) {
        width: 6px; height: 6px;
        background: linear-gradient(135deg, #8b5cf6, #c084fc);
        top: 60%; left: 80%;
        --p-dur: 8s; --p-delay: 0.3s;
        --p-x: -25px; --p-y: 30px;
      }
      .splash-particle:nth-child(3) {
        width: 8px; height: 8px;
        background: linear-gradient(135deg, #f59e0b, #fbbf24);
        top: 70%; left: 10%;
        --p-dur: 6.5s; --p-delay: 0.6s;
        --p-x: 40px; --p-y: -15px;
      }
      .splash-particle:nth-child(4) {
        width: 5px; height: 5px;
        background: linear-gradient(135deg, #10b981, #34d399);
        top: 15%; left: 75%;
        --p-dur: 9s; --p-delay: 0.9s;
        --p-x: -35px; --p-y: 25px;
      }
      .splash-particle:nth-child(5) {
        width: 7px; height: 7px;
        background: linear-gradient(135deg, #f472b6, #ec4899);
        top: 40%; left: 85%;
        --p-dur: 7.5s; --p-delay: 1.2s;
        --p-x: -20px; --p-y: -35px;
      }
      .splash-particle:nth-child(6) {
        width: 9px; height: 9px;
        background: linear-gradient(135deg, #38bdf8, #0ea5e9);
        top: 80%; left: 70%;
        --p-dur: 6s; --p-delay: 1.5s;
        --p-x: 25px; --p-y: -25px;
      }
      .splash-particle:nth-child(7) {
        width: 4px; height: 4px;
        background: linear-gradient(135deg, #a78bfa, #8b5cf6);
        top: 25%; left: 20%;
        --p-dur: 8.5s; --p-delay: 0.15s;
        --p-x: -15px; --p-y: 40px;
      }
      .splash-particle:nth-child(8) {
        width: 6px; height: 6px;
        background: linear-gradient(135deg, #fb923c, #f97316);
        top: 50%; left: 30%;
        --p-dur: 7.2s; --p-delay: 0.8s;
        --p-x: 20px; --p-y: -30px;
      }
      @keyframes particle-float {
        0% {
          opacity: 0;
          transform: translate(0, 0) scale(0.6);
        }
        15% {
          opacity: 0.5;
        }
        30% {
          opacity: 0.7;
          transform: translate(var(--p-x, 30px), var(--p-y, -20px)) scale(1);
        }
        60% {
          opacity: 0.4;
          transform: translate(calc(var(--p-x, 30px) * -0.5), calc(var(--p-y, -20px) * 1.2)) scale(0.8);
        }
        85% {
          opacity: 0.2;
        }
        100% {
          opacity: 0;
          transform: translate(calc(var(--p-x, 30px) * -0.8), calc(var(--p-y, -20px) * -0.6)) scale(0.4);
        }
      }

      /* ─── Entrance animation ─── */
      .splash-entrance {
        position: relative;
        opacity: 0;
        transform: translateY(20px) scale(0.92);
        animation: splash-fade-in 0.6s cubic-bezier(0.33, 1, 0.68, 1) 0.1s forwards;
      }
      @keyframes splash-fade-in {
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
    </style>
  </head>
  <body class="bg-surface-50 dark:bg-surface-950 text-surface-900 dark:text-surface-100 antialiased">
    <!-- Splash Screen -->
    <div id="app-splash">
      <div class="splash-entrance" style="display:flex;flex-direction:column;align-items:center;">
        <!-- Floating particles behind logo -->
        <div class="splash-particles">
          <div class="splash-particle"></div>
          <div class="splash-particle"></div>
          <div class="splash-particle"></div>
          <div class="splash-particle"></div>
          <div class="splash-particle"></div>
          <div class="splash-particle"></div>
          <div class="splash-particle"></div>
          <div class="splash-particle"></div>
        </div>
        <div class="splash-logo">
          <div class="splash-ring"></div>
          <div class="splash-logo-inner">
            <img src="/logo.png" alt="VidTopUp" />
          </div>
        </div>
        <div class="splash-brand">VidTopUp</div>
        <div class="splash-loader">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
